name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: esale
          POSTGRES_PASSWORD: esale
          POSTGRES_DB: esale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U esale -d esale_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ESALE_TEST_DATABASE_URL: >-
        postgresql://esale:esale@localhost:5432/esale_test
      ESALE_REDIS_URL: redis://localhost:6379/0

    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      
      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run database migrations
        env:
          ESALE_DATABASE_URL: ${{ env.ESALE_TEST_DATABASE_URL }}
        run: uv run alembic upgrade head 
      - name: Start payment service
        env:
          ESALE_DATABASE_URL: ${{ env.ESALE_TEST_DATABASE_URL }}
        run: |
          uv run uvicorn app.payment_service:app \
            --host 127.0.0.1 \
            --port 9000 > /tmp/payment-service.log 2>&1 &

          for i in {1..20}; do
            if curl -sf http://127.0.0.1:9000/health/live; then
              exit 0
            fi
            sleep 0.5
          done

          cat /tmp/payment-service.log
          exit 1
      - name: Run tests
        run: uv run pytest -q