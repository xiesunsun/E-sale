[project]
name = "e-sale"
version = "0.1.0"
description = "A commerce system that evolves one software-engineering problem at a time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath=["."]
